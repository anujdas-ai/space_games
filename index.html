<title>SABOTIX</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050816;--p:rgba(8,16,36,.94);--t:#e8f1ff;--m:#8fb0d8;--a:#38bdf8;--ok:#34d399;--bad:#fb7185;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--p:rgba(236,244,255,.97);--t:#0b1530;--m:#37557f}}
*{box-sizing:border-box}html,body{touch-action:manipulation;margin:0;height:100%;background:var(--bg);font:14px Inter,system-ui,sans-serif;color:var(--t);overflow:hidden}
h2,h3{font-family:Orbitron,system-ui,sans-serif;margin:.2em 0}
#w{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
canvas{width:100%;aspect-ratio:16/9;max-height:100%;object-fit:contain}
.panel{background:var(--p);border:1px solid #38bdf866;border-radius:14px;padding:12px;color:var(--t)}
button{font:inherit;color:#e8f1ff;background:#12305a;border:1px solid var(--a);border-radius:8px;padding:7px 11px;cursor:pointer;margin:2px}
button:disabled{opacity:.4;cursor:default}button.go{background:linear-gradient(90deg,#f59e0b,#f97316);color:#111;font-weight:700;border:0}
.mc{flex:1 1 200px;text-align:left;background:linear-gradient(160deg,#0d2c5e,#07142e);border-width:2px;border-radius:12px;padding:10px 12px;margin:0;line-height:1.35}.mc:hover{filter:brightness(1.3)}button.on{outline:3px solid #fde047}.sw{width:30px;height:30px;padding:0;border-radius:50%}
.o{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;overflow:auto}
.hide{display:none!important}small,.m{color:var(--m)}.ok{color:var(--ok)}.bad{color:var(--bad)}
#hud{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;pointer-events:none}#hud>*{pointer-events:auto}
#mod{background:#000a;z-index:5}#lobby{display:block;padding:0;overflow:hidden;pointer-events:none}#lobby>*{pointer-events:auto}#lobby>#lt{pointer-events:none}
#alert{position:absolute;top:96px;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;border:2px solid #fff;border-radius:12px;padding:8px 14px;font-weight:700;text-align:center;animation:fl .7s infinite alternate;z-index:3}
@keyframes fl{to{background:#f59e0b;color:#111}}@media(prefers-reduced-motion:reduce){#alert{animation:none}}
#pad{position:absolute;bottom:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}#pad>div{pointer-events:auto}
#pad button{width:50px;height:50px;font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
#fb{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:min(760px,96%);z-index:2}
.bt{display:block;width:100%;text-align:left;margin:5px 0}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#log{height:130px;overflow:auto;margin:6px 0}#log p{margin:4px 0}
input[type=text]{background:#0006;border:1px solid var(--a);color:inherit;border-radius:8px;padding:7px;font:inherit}

mission:{l:'🚀 Missions',f:['Voyager 1 launched in 1977 and crossed into interstellar space in 2012.','OSIRIS-REx returned 121.6 g of asteroid Bennu to Earth in 2023.','The James Webb Space Telescope sits near the Sun–Earth L2 point, about 1.5 million km from Earth.','The International Space Station circles Earth about every 90 minutes, so crews see around 16 sunrises a day.']},
bh:{l:'🕳️ Black holes',f:['The Event Horizon Telescope imaged the black hole M87* in 2019.','Sagittarius A*, the black hole at the centre of our galaxy, was imaged in 2022.','Light cannot escape from inside a black hole’s event horizon.','GPS satellites need corrections for relativity, or their clocks would drift by tens of microseconds a day.']},
life:{l:'👽 Life',f:['Tardigrades (water bears) survived exposure to open space in a 2007 experiment.','Jupiter’s moon Europa likely hides a salty ocean under its icy shell.','Samples from asteroid Bennu held amino acids, building blocks of life, but no life.','Humanity has not confirmed life beyond Earth, which is why scientists keep searching.']}};
const HQ=[{s:'A day on Venus is longer than its year.',a:1,e:'Venus spins once in about 243 Earth days but orbits the Sun in about 225.'},{s:'Sound travels well through the vacuum of space.',a:0,e:'Sound needs air or another material to travel through. Space is almost empty, so it is silent.'},{s:'Sunlight takes about 8 minutes to reach Earth.',a:1,e:'About 8 minutes 20 seconds, across roughly 150 million km.'},{s:'Saturn is so dense that it would sink in water.',a:0,e:'Saturn is the least dense planet. Its average density is lower than water’s.'},{s:'The Moon is slowly moving away from Earth.',a:1,e:'It recedes by about 3.8 cm each year, measured with reflectors left by Apollo crews.'},{s:'Astronauts on the ISS see about one sunrise a day.',a:0,e:'The ISS orbits every 90 minutes, so crews see around 16 sunrises a day.'},{s:'Humanity has confirmed life on Europa.',a:0,e:'Europa likely has an ocean, but no life has been found there or anywhere beyond Earth.'},{s:'Light cannot escape from inside a black hole’s event horizon.',a:1,e:'The escape speed inside the horizon is greater than the speed of light.'},{s:'Mars has the tallest known volcano in the Solar System.',a:1,e:'Olympus Mons stands about 22 km high.'},{s:'India’s Chandrayaan-3 landed near the Moon’s south pole.',a:1,e:'It touched down on 23 Aug 2023, a first for any mission.'}];
const HM={c:'star',i:0,q:Math.floor(Math.random()*HQ.length),st:0,best:0,mode:'f',done:0,ok:0,ty:null};
function ty(t){const e=$('ft');if(!e)return;clearInterval(HM.ty);if(matchMedia('(prefers-reduced-motion:reduce)').matches){e.textContent=t;return}let n=0;HM.ty=setInterval(()=>{n+=2;e.textContent=t.slice(0,n);if(n>=t.length)clearInterval(HM.ty)},16)}
function hrender(){const h=$('hp'),q=HQ[HM.q%HQ.length];
if(HM.mode=='q'){h.innerHTML=`<div class="hh"><b>🎯 TRUE OR FALSE</b><small>Streak ${HM.st} · Best ${HM.best}</small></div><p class="hb">${esc(q.s)}</p>`+(HM.done?`<p class="${HM.ok?'ok':'bad'}"><b>${HM.ok?'Correct!':'Not quite.'}</b> ${esc(q.e)}</p><div class="row"><button class="go" onclick="HM.q++;HM.done=0;hrender()">NEXT ▶</button><button onclick="hc(HM.c)">Back to scanner</button></div>`:`<div class="row"><button onclick="hfa(1)">✔ TRUE</button><button onclick="hfa(0)">✘ FALSE</button><button onclick="hc(HM.c)">Back to scanner</button></div>`)}
else{const F=HF[HM.c].f;h.innerHTML=`<div class="hh"><b>📡 COSMIC SCANNER</b><small>Tap a glowing sensor on the ship, or pick a topic</small></div><div class="row" style="margin-top:6px">${Object.keys(HF).map(k=>`<button class="ch ${HM.c==k?'on':''}" onclick="hc('${k}')">${HF[k].l}</button>`).join('')}</div><p class="hb" id="ft"></p><div class="row"><button class="go" onclick="hn()">NEXT FACT ▶</button><button onclick="hq()">🎯 True or False?</button></div>`;ty(F[HM.i%F.length])}}
function hc(k){HM.c=k;HM.i=0;HM.mode='f';try{SX.t(700,.12,'sine',.06,1100)}catch(e){}hrender()}
function hn(){HM.i++;hrender()}
function hq(){HM.mode='q';HM.done=0;hrender()}
function hfa(v){if(HM.done)return;const q=HQ[HM.q%HQ.length];HM.done=1;HM.ok=v==q.a;if(HM.ok){HM.st++;HM.best=Math.max(HM.best,HM.st);try{SX.q([660,880],.08)}catch(e){}}else{HM.st=0;try{SX.t(160,.25,'sawtooth',.07)}catch(e){}}hrender()}
function home(){G.mode='home';['hud','alert','pad','fb','mod','lobby','lbar'].forEach(i=>$(i).classList.add('hide'));$('home').classList.remove('hide');hrender()}
function play(){try{SX.q([392,523,784],.1)}catch(e){}$('home').classList.add('hide');lobby()}
addEventListener('keydown',e=>{if(G.mode=='home'&&e.key=='Enter'&&e.target.tagName!='BUTTON')play()});
/* ---------- on-screen arrows: pointer capture, cancel-safe ---------- */
document.querySelectorAll('#pad [data-k]').forEach(el=>{const k=el.dataset.k,off=()=>{K[k]=0};el.addEventListener('pointerdown',e=>{e.preventDefault();K[k]=1;try{el.setPointerCapture(e.pointerId)}catch(_){}});['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,off));el.addEventListener('contextmenu',e=>e.preventDefault())});
home();requestAnimationFrame(loop);
</script>
